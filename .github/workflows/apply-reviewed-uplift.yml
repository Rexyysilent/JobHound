name: Apply reviewed uplift (temporary)
on:
  push:
    branches: ['review/uplift-20260917']
    paths: ['tools/uplift_payload/**', '.github/workflows/apply-reviewed-uplift.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Rexyysilent/JobHound' && github.ref == 'refs/heads/review/uplift-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply hash-verified local review patch
        shell: python
        run: |
          import gzip, hashlib, pathlib, subprocess
          patch = gzip.decompress(b''.join(pathlib.Path(f'tools/uplift_payload/{i}').read_bytes() for i in range(4)))
          assert hashlib.sha256(patch).hexdigest() == 'f055773dc2a366cf7c72226e9a1071721371d2a532fd313e7edaa9ca3ddddec6'
          assert subprocess.check_output(['git','hash-object','README.md'],text=True).strip() == '5ca69e297812f2270f330e67396c5ac8dfb969fe'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
      - name: Install and run complete offline suite
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Stage only reviewed public changes
        shell: python
        run: |
          import subprocess
          paths = '''CONTRIBUTING.md docs/GETTING_STARTED.md docs/ROADMAP.md docs/UPLIFT_REVIEW.md docs/replay-comparison.json docs/workbench-checks.json jobhound/sources/ats_ashby.py jobhound/sources/ats_batch.py jobhound/sources/ats_greenhouse.py jobhound/sources/ats_lever.py jobhound/sources/base.py jobhound/v41/compensation.py jobhound/v41/digest.py jobhound/v41/documents.py jobhound/v41/engine.py jobhound/v41/extract.py jobhound/v41/replay.py jobhound/v41/store.py tests/test_audit_uplift_contract.py tests/test_pay_integrity.py tests/test_replay_integrity.py tests/test_v41.py workbench/index.html'''.split()
          subprocess.run(['git','rm','-r','tools/uplift_payload'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          assert subprocess.check_output(['git','hash-object','README.md'],text=True).strip() == '5ca69e297812f2270f330e67396c5ac8dfb969fe'
      - name: Verify publication boundary
        run: python tools/check_publication.py --index
      - name: Commit and push review branch only
        run: |
          # Reuse the public initial release author, not a connector's identity.
          git config user.name "$(git show -s --format=%an 58bab4df053f60c8edf09d4e7a3d87a72957d18f)"
          git config user.email "$(git show -s --format=%ae 58bab4df053f60c8edf09d4e7a3d87a72957d18f)"
          git commit -m 'fix: preserve evidence through acquisition, pay and replay' -m 'AI-assisted implementation with offline regression and synthetic replay checks. README and production settings unchanged. Review before merging.'
          git push origin HEAD:refs/heads/review/uplift-20260917
