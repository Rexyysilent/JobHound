# Public starter template. All discovery, enrichment and delivery are OFF.
# Copy to ignored config.yaml, then select sources and tune your policy.
# Country/currency defaults in the legacy adapters are India/INR; configure them explicitly.
engine:
  active: v4.2
  capture_snapshots: true
sources:
  remotive:
    enabled: false
  remoteok:
    enabled: false
  arbeitnow:
    enabled: false
  adzuna:
    enabled: false
  jsearch:
    enabled: false
  ats:
    enabled: false
  serp:
    enabled: false
email_ingest:
  enabled: false
  sender_platform_map: {}
digest:
  channels: []
  join_nudges: 0
incidents:
  enabled: false
report:
  enabled: false
scam:
  llm:
    enabled: false
# V5.5 decision policy with v6 fetching. `run` uses it only when BOTH keys are
# true; otherwise the legacy V4.2 engine runs. See README "Turning on V5.5".
v55:
  enabled: false
  production_approved: false
  # Full cards per band (the code default is 3). Eligible jobs beyond the
  # card limits are listed compactly under "Also eligible" in the email.
  max_verify_actions: 8
  account_states: []            # your own dated application/project states (optional)
  # One bounded HTTP budget per run, shared by discovery and page hydration.
  production_fetch:
    workspace: runtime/v6       # request ledger + verification history (ignored by Git)
    requests: 200               # a full run typically makes ~55-80 discovery requests
    seconds: 600
    request_seconds: 60
    wire_bytes: 16000000        # per response, on the wire
    decoded_bytes: 32000000     # per response, decompressed (some ATS boards exceed 6 MB)
    concurrency: 4
# Durable delivery: an outbox with per-destination receipts, safe retries and
# no silent re-sends. Requires V5.5. Also set digest.channels and .env.
delivery:
  enabled: false
  production_approved: false
  workspace_id: jobhound
  profile_id: default
  card_cap: 15
  status_cap: 5
  max_parts_per_run: 32
  max_envelopes_per_run: 4      # per destination: up to 3 safe retries + today's digest
region:
  worldwide_terms:
  - worldwide
  - anywhere
  - remote
  india_terms: []
  lang_terms: []
relevance:
  keywords:
    boost_high:
    - ai training
    - data annotation
    boost_mid:
    - python
    - automation
    boost_lang: []
